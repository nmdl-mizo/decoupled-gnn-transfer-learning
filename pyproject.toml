[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decoupled-gnn-transfer-learning"
version = "0.1.0"
description = "Decoupled GNN embeddings with Ridge/SVR for materials property extrapolation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.20",
  "pandas>=1.3",
  "scikit-learn>=1.0",
  "matplotlib>=3.5",
  "tqdm>=4.60",
]

[project.optional-dependencies]
gnn = [
  "torch",
  "torch-geometric",
  "ase",
  "lmdb",
  "pymatgen",
]

[tool.setuptools.packages.find]
where = ["src"]
